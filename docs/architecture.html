<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>架构</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f7f4ee; }
  body {
    width: 1440px;
    height: 860px;
    color: #1a1814;
    font-family: "Songti SC", "Noto Serif SC", serif;
    padding: 64px 72px 56px;
  }
  .kicker {
    font-family: "PingFang SC", sans-serif;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: #8a8172;
  }
  h1 {
    margin-top: 14px;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .rule { margin-top: 22px; height: 1px; background: #1a1814; width: 72px; }
  .stage {
    margin-top: 48px;
    display: grid;
    grid-template-columns: 1fr 88px 1fr 88px 1fr;
    align-items: center;
  }
  .group h2 {
    font-family: "PingFang SC", sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: #8a8172;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .item {
    padding: 16px 0;
    border-top: 1px solid #e4ddd0;
  }
  .item strong { display: block; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .item span {
    display: block;
    margin-top: 6px;
    font-family: "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.65;
    color: #5c564c;
  }
  .link {
    text-align: center;
    color: #1a1814;
    font-family: "PingFang SC", sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
  }
  .link i {
    display: block;
    margin: 10px auto;
    width: 48px;
    height: 1px;
    background: #1a1814;
    font-style: normal;
  }
  .center {
    background: #1a1814;
    color: #f7f4ee;
    min-height: 420px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .center .num {
    font-family: "PingFang SC", sans-serif;
    letter-spacing: 0.22em;
    font-size: 12px;
    color: #b7ae9f;
  }
  .center h2 { font-size: 32px; font-weight: 600; letter-spacing: 0.08em; margin-top: 18px; }
  .center p {
    font-family: "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: #e7e1d6;
  }
</style>
</head>
<body>
  <div class="kicker">DATA MODEL</div>
  <h1>三条记录，汇入同一界面</h1>
  <div class="rule"></div>
  <div class="stage">
    <div class="group">
      <h2>材料</h2>
      <div class="item"><strong>写卷目录</strong><span>西元纪年、题名、题记、馆藏。以写卷编号连到字图。</span></div>
      <div class="item"><strong>字图库</strong><span>图像编号、坐标、机器识别、佛典对字、人工校对、代表字形。</span></div>
      <div class="item"><strong>标注库</strong><span>按账号记下残损、误入、字形分类、备注与字头任务。</span></div>
    </div>
    <div class="link">汇入<i></i></div>
    <div class="center">
      <div>
        <div class="num">WORKSPACE</div>
        <h2>整理界面</h2>
      </div>
      <p>按字头检索。字图依写卷与年代排列。确认代表字形，对照辞书，或回到标有红框的原卷。</p>
    </div>
    <div class="link">生成<i></i></div>
    <div class="group">
      <h2>成果</h2>
      <div class="item"><strong>年代简表</strong><span>代表字图按写卷目录中的西元纪年排列。</span></div>
      <div class="item"><strong>字表详编</strong><span>校对字段、单字图像，以及原卷上的红框。</span></div>
      <div class="item"><strong>分源候选</strong><span>人工确认与模型候选并列。核对之后写入代表字形。</span></div>
    </div>
  </div>
</body>
</html>
